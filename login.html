<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Кіру — Qarjy</title><link rel="stylesheet" href="style.css"></head><body class="auth"><a class="logo" href="index.html">₸ Qarjy</a><main class="authbox"><div class="tabs"><button id="lt" class="active">Кіру</button><button id="rt">Тіркелу</button></div><form id="login"><h2>Қош келдіңіз!</h2><p>Аккаунтыңызға кіріңіз</p><label>Email<input id="le" type="email" required placeholder="example@mail.com"></label><label>Құпиясөз<input id="lp" type="password" required></label><button class="btn">Жүйеге кіру →</button><p id="lm"></p></form><form id="register" class="hide"><h2>Аккаунт ашу</h2><p>Жаңа пайдаланушы ретінде тіркеліңіз</p><label>Аты-жөніңіз<input id="rn" required></label><label>Email<input id="re" type="email" required></label><label>Құпиясөз<input id="rp" type="password" minlength="4" required></label><button class="btn">Тіркелу →</button><p id="rm"></p></form></main><script src="auth.js"></script></body></html>
